(()=>{

let W=640,H=360,scale=1,dpr=1,offX=0,offY=0,portrait=false;
const FD='"Black Ops One", Impact, "Arial Black", sans-serif';
const FU='"Chakra Petch", "Trebuchet MS", Arial, sans-serif';
const C={ink:'#1b1f22',gold:'#ffd23f',sand:'#e3ad63',sandD:'#b97a3e',lip:'#f4cf8a',
  eHelm:'#7a3524',eShirt:'#b5553a',ePants:'#6b3b2b',gShirt:'#c9793b',beret:'#2f2f3a'};
const PCOL=[
  {helm:'#56702f',shirt:'#76923c',pants:'#4d5e2a',skin:'#f0c090',strap:'#ffd23f',pack:'#5d4a2c',tag:'#ffd23f'},
  {helm:'#3d5a78',shirt:'#5b86a8',pants:'#34485e',skin:'#d9a57a',strap:'#ff8a3a',pack:'#3a3f4a',tag:'#7fd0ff'}
];

/* ---------- utilidades ---------- */
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const num=v=>{v=+v;return Number.isFinite(v)?v:0};
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const inRect=(px,py,r)=>px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let best=+store.get('pt_best')||0;
function saveBest(){store.set('pt_best',String(best))}

/* ---------- audio: efectos ---------- */
let AC=null,muted=store.get('pt_sfx')==='0',noiseBuf=null;
function getNoise(){if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}return noiseBuf}
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function distCurve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=Math.tanh(k*x)/Math.tanh(k)}return c}
// bus con distorsión (guitarra): entrada -> saturación -> filtros -> salida
function makeDist(dest,k,lp,vol){const i=AC.createGain(),ws=AC.createWaveShaper(),f=AC.createBiquadFilter(),h=AC.createBiquadFilter(),o=AC.createGain();
  ws.curve=distCurve(k);ws.oversample='2x';f.type='lowpass';f.frequency.value=lp;h.type='highpass';h.frequency.value=70;o.gain.value=vol;
  i.connect(ws);ws.connect(f);f.connect(h);h.connect(o);o.connect(dest);return i}
let sfxDist=null;
function sDist(){if(!sfxDist)sfxDist=makeDist(AC.destination,30,4200,.18);return sfxDist}
function tone(f,d,type='square',v=.06,slide=0,dist=false){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dist?sDist():AC.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v=.2,f=800,dist=false,type='lowpass'){if(!AC||muted)return;const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=getNoise();fl.type=type;fl.frequency.setValueAtTime(f,t);if(type==='lowpass')fl.frequency.exponentialRampToValueAtTime(60,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(dist?sDist():AC.destination);s.start(t,Math.random()*.5);s.stop(t+d+.02)}
// acorde de quinta distorsionado (para golpes de guitarra en efectos)
function sChord(m,d,v=.5,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay;for(const [iv,dt] of [[0,0],[7,5],[12,-4]]){const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=440*Math.pow(2,(m+iv-69)/12);o.detune.value=dt;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(sDist());o.start(t);o.stop(t+d+.02)}}
const RAW={
  thunder(){noise(1.8,.32,380,true);tone(45,1.2,'sine',.2,-15)},
  shot(){noise(.08,.12,3000);tone(160,.07,'square',.05,-90,true)},
  mg(){noise(.05,.09,4200);tone(120,.04,'square',.03,-50,true)},
  shotgun(){noise(.3,.3,1900,true);tone(80,.25,'sine',.25,-40)},
  flame(){noise(.14,.07,700,false,'bandpass')},
  laser(){tone(1400,.18,'square',.05,-1150,true);tone(2100,.1,'sine',.03,-1500)},
  knife(){noise(.12,.12,5200,false,'highpass');tone(2400,.08,'triangle',.03,-1600)},
  rocket(){noise(.35,.14,1400,true);tone(180,.3,'sawtooth',.035,260)},
  boom(){noise(.8,.35,900,true);tone(70,.6,'sine',.28,-40)},
  jump(){tone(260,.12,'square',.03,300)},
  hurt(){tone(180,.3,'sawtooth',.2,-110,true)},
  pick(){sChord(52,.18,.45);sChord(57,.35,.45,.12)},
  weapon(){sChord(52,.12,.5);sChord(55,.12,.5,.1);sChord(57,.45,.5,.2)},
  eshot(){noise(.06,.06,2200)},
  snipe(){noise(.12,.16,5000);tone(900,.2,'sawtooth',.04,-700,true)},
  tink(){tone(2600,.06,'square',.03,400);tone(3400,.05,'sine',.03)},
  toss(){tone(520,.15,'triangle',.04,-220)},
  rotor(){noise(.07,.035,320)},
  cannon(){noise(.3,.28,600,true)},
  alert(){sChord(40,.5,.6);sChord(46,.8,.6,.45)},
  cp(){sChord(52,.12,.45);sChord(55,.12,.45,.12);sChord(59,.4,.45,.24)}
};
const sfxQ=new Set();
const SFX={};for(const k in RAW)SFX[k]=()=>{RAW[k]();if(netMode==='host')sfxQ.add(k)};

/* ---------- audio: música metalera (sintetizada) ---------- */
let musicOn=store.get('pt_music')!=='0',musGain=null,gtrIn=null,leadIn=null;
function ensureMus(){if(AC&&!musGain){musGain=AC.createGain();musGain.gain.value=musicOn?.5:0;musGain.connect(AC.destination);
  gtrIn=makeDist(musGain,55,3000,.2);leadIn=makeDist(musGain,18,3600,.14)}}
function setMusic(on){musicOn=on;store.set('pt_music',on?'1':'0');if(AC&&musGain)musGain.gain.setTargetAtTime(on?.5:0,AC.currentTime,.05)}
const mf=m=>440*Math.pow(2,(m-69)/12);
// guitarra rítmica: quinta + octava; "muted" = palm mute (más oscuro y corto)
function mGtr(t,root,d,muted){for(const [iv,dt] of [[0,0],[7,4],[12,-3]]){if(muted&&iv===12)continue;
  const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.value=mf(root+iv);o.detune.value=dt;
  f.type='lowpass';f.frequency.value=muted?850:2800;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.4,t+.004);g.gain.setValueAtTime(.4,t+d*.75);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(f);f.connect(g);g.connect(gtrIn);o.start(t);o.stop(t+d+.03)}}
function mLead(m,t,d,v){const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();o.type='square';o.frequency.value=mf(m);
  l.frequency.value=6;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(d>.2?9:0,t+Math.min(.18,d));l.connect(lg);lg.connect(o.detune);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.setValueAtTime(v,t+d*.8);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(leadIn);o.start(t);l.start(t);o.stop(t+d+.03);l.stop(t+d+.03)}
function mBass(m,t,d,v){const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=mf(m);f.type='lowpass';f.frequency.value=420;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(f);f.connect(g);g.connect(musGain);o.start(t);o.stop(t+d+.03)}
function mKick(t,v){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+.11);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(musGain);o.start(t);o.stop(t+.18)}
function mNoise(t,d,v,type,freq){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=getNoise();f.type=type;f.frequency.value=freq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(musGain);s.start(t,Math.random()*.5);s.stop(t+d+.03)}
function parseSeq(bars){const tok=bars.join(' ').trim().split(/\s+/),ev={},SM={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  for(let i=0;i<tok.length;i++){const m=/^([A-G])(#?)(\d)$/.exec(tok[i]);if(!m)continue;let d=1;while(tok[i+d]==='-')d++;ev[i]={m:(+m[3]+1)*12+SM[m[1]]+(m[2]?1:0),d}}return ev}
// guitarra: x = golpe apagado, O = acorde abierto (se sostiene con -), . = silencio
function parseGtr(bars){const tok=bars.join(' ').trim().split(/\s+/),ev={};for(let i=0;i<tok.length;i++){if(tok[i]==='x')ev[i]={mute:true,d:1};else if(tok[i]==='O'){let d=1;while(tok[i+d]==='-')d++;ev[i]={mute:false,d}}}return ev}
const pat=s=>s.trim().split(/\s+/).map(c=>c==='x');
const TRACKS={
  title:{bpm:100,roots:[40,40,36,38],
    gtr:['O - - - x x x x O - - - x x . .','O - - - x x x x O - - - x x . .','O - - - x x x x O - - - O - - -','O - - - - - - - x x x x x x x x'],
    lead:['E4 - - - G4 - - - B4 - - - A4 - G4 -','E4 - - - - - - - . . . . . . . .','C5 - - - B4 - - - G4 - - - A4 - - -','B4 - - - - - - - . . . . D5 - - -'],leadV:.2,
    kick:'x . . . x . . . x . . . x . x .',snare:'. . . . x . . . . . . . x . . .',hat:'x . x . x . x . x . x . x . x .',crash:1},
  level:{bpm:150,roots:[40,40,43,45,40,40,36,47],
    gtr:['x . x x x . x x x . x x O - - -','x . x x x . x x x . x x O - O -','x . x x x . x x x . x x O - - -','x x x x x x x x O - - - O - - -'],
    lead:['E5 - - - . . D5 - E5 - G5 - E5 - D5 -','B4 - - - - - - - . . . . . . . .','G4 - - A4 - - B4 - D5 - - - B4 - A4 -','A4 - - - - - - - . . . . . . . .',
          'E5 - E5 . G5 - E5 . A5 - G5 - E5 - D5 -','E5 - - - - - - - B4 - - - E5 - - -','C5 - - - B4 - - - A4 - - - G4 - A4 -','B4 - - - - - - - D#5 - - - - - - -'],leadV:.16,
    kick:'x . x x x . x x x . x x x . . .',snare:'. . . . x . . . . . . . x . . .',hat:'x . x . x . x . x . x . x . x .',crash:2},
  boss:{bpm:176,roots:[40,41,40,46],
    gtr:['x x x x x x x x x x x x x x x x','x x x x x x x x x x x x x x x x','x x x x x x x x x x x x x x x x','O - - - O - - - O - O - O - O -'],
    lead:['E5 E5 E5 E5 G5 G5 G5 G5 F#5 F#5 F#5 F#5 F5 F5 F5 F5','F5 F5 F5 F5 A5 A5 A5 A5 G#5 G#5 G#5 G#5 G5 G5 G5 G5','E5 E5 E5 E5 G5 G5 G5 G5 F#5 F#5 F#5 F#5 F5 F5 F5 F5','A#5 - - - A5 - - - G5 - - - F5 - E5 -'],leadV:.12,
    kick:'x x x x x x x x x x x x x x x x',snare:'. . x . . . x . . . x . . . x .',hat:'. . . . . . . . . . . . . . . .',crash:1}
};
for(const k in TRACKS){const t=TRACKS[k];t.len=t.roots.length*16;const rep=a=>{const o=[];for(let i=0;i<t.roots.length;i++)o.push(a[i%a.length]);return o};
  t.gev=parseGtr(rep(t.gtr));t.ev=parseSeq(rep(t.lead));t.k=pat(t.kick);t.s=pat(t.snare);t.h=pat(t.hat)}
const MUS={cur:null,step:0,next:0};
function musicSet(n){if(MUS.cur===n)return;MUS.cur=n;MUS.step=0;if(AC)MUS.next=AC.currentTime+.1}
function playStep(tr,step,t,spb){
  const bar=Math.floor(step/16),s=step%16,root=tr.roots[bar%tr.roots.length];
  const g=tr.gev[step];if(g){mGtr(t,root,g.mute?spb*.85:g.d*spb*.95,g.mute);mBass(root-12,t,(g.mute?1:g.d)*spb*.9,.13)}
  const ev=tr.ev[step];if(ev)mLead(ev.m,t,ev.d*spb*.95,tr.leadV);
  if(tr.k[s])mKick(t,MUS.cur==='boss'?.24:.34);
  if(tr.s[s]){mNoise(t,.14,.15,'highpass',1300);mNoise(t,.05,.1,'bandpass',220)}
  if(tr.h[s])mNoise(t,.03,.028,'highpass',7500);
  if(s===0&&bar%tr.crash===0)mNoise(t,1.1,.07,'highpass',4500);
}
function musicTick(){
  if(!AC||!MUS.cur||AC.state!=='running')return;ensureMus();
  const tr=TRACKS[MUS.cur],spb=60/tr.bpm/4,now=AC.currentTime;
  if(MUS.next<now-.05)MUS.next=now+.05;
  while(MUS.next<now+.15){if(musicOn)playStep(tr,MUS.step,MUS.next,spb);MUS.next+=spb;MUS.step=(MUS.step+1)%tr.len}
}
function jingle(win){if(!AC||!musicOn)return;ensureMus();const t=AC.currentTime+.05;
  if(win){[[40,0,.14],[43,.15,.14],[45,.3,.14],[47,.45,1.2]].forEach(([m,o,d])=>mGtr(t+o,m,d,false));[76,79,83].forEach((m,i)=>mLead(m,t+.45+i*.12,.8,.14));for(let i=0;i<4;i++)mKick(t+i*.15,.3)}
  else{[[40,0,.5],[39,.5,.5],[38,1,.5],[37,1.5,1.4]].forEach(([m,o,d])=>mGtr(t+o,m,d,false))}}

/* ---------- soldados ---------- */
const CHARS=[

let selChar=clamp(+store.get('pt_char')||0,0,3);

let xflash=0,state='title',score=0,kills=0,time=0,cpIndex=0,camX=0,shakeT=0,shakeM=0,flash=0,banner=null,menuOpen=false,prevState='';
let PL=[],enemies=[],bullets=[],ebullets=[],grenades=[],parts=[],pickups=[],crates=[],floats=[],queue=[],boss=null,bossActive=false,winT=0,uid=1;
const fxQ=[],ftQ=[];
// red
let room=null,netMode=null,myPeer=null,partnerPeer=null,hostPeer=null,lobbyRole=null,joinHost=null,lobbyMsg='',startAt=0,lastStartEmit=0,lastSnapSent=0,snapSeq=0,lastSnapQ=-1,lastSnapAt=0,netCamT=0,partnerChar=0;

const myIdx=()=>netMode==='guest'?1:0;
const me=()=>PL[myIdx()]||PL[0];

function newPlayer(x,idx,ch){const c=CHARS[ch]||CHARS[0];return{idx,ch,x,y:topAt(x)-32,w:16,h:32,vx:0,vy:0,face:1,onGround:false,hp:c.hp,maxHp:c.hp,inv:1.2,weapon:'P',ammo:0,bombs:c.bombs,fireCd:0,run:0,alive:true,dead:0,recoil:0,safeX:x,up:false,crouch:false,knife:0,dust:0,
  inp:{},jumpEdge:false,bombEdge:false,lastJ:null,lastB:null}}
function startMission(fromCp){
  if(!fromCp){score=0;kills=0;time=0;cpIndex=0}
  buildLevel();theme=selMission;
  const cp=CPS[cpIndex];
  PL=[newPlayer(cp,0,selChar)];
  if(netMode==='host'&&partnerPeer)PL.push(newPlayer(cp+26,1,partnerChar));
  enemies=[];bullets=[];ebullets=[];grenades=[];parts=[];pickups=[];crates=[];floats=[];fxQ.length=0;ftQ.length=0;
  queue=SPAWNS.filter(s=>s.x>cp+300).map(s=>({...s})).sort((a,b)=>a.x-b.x);
  boss=null;bossActive=false;winT=0;camX=Math.max(0,cp-120);
  banner={txt:cpIndex===0?'MISIÓN '+(theme+1)+' · '+MISSIONS[theme]:'PUNTO DE CONTROL',t:2.2};
  state='play';menuOpen=false;
}
function spawn(s){
  if(s.t==='crate'){crates.push({id:uid++,t:'crate',x:s.x,y:topAt(s.x+15)-28,w:30,h:28,hp:3,d:s.d,hit:0});return}
  if(s.t==='barrel'){crates.push({id:uid++,t:'barrel',x:s.x,y:topAt(s.x+11)-30,w:22,h:30,hp:2,hit:0});return}
  const [w,h,hp]=ESZ[s.t];
  const y=s.t==='heli'?70:s.y!=null?s.y:topAt(s.x+w/2)-h;
  const e={id:uid++,type:s.t,x:s.t==='heli'?camX+W+40:s.x,y,w,h,vx:0,vy:0,hp,maxHp:hp,face:-1,cd:rand(.6,1.4),pdir:-1,pt:rand(1,2.5),hit:0,dead:0,run:0,onGround:false,burst:0,aim:0,peek:0,t:0};
  if(s.t==='heli'){e.cd=2;banner={txt:'¡HELICÓPTERO ENEMIGO!',t:1.6};SFX.alert()}
  enemies.push(e);
}
function nearest(x){let b=null,bd=1e9;for(const p of PL){if(!p.alive)continue;const d=Math.abs(p.x+8-x);if(d<bd){bd=d;b=p}}return b||PL[0]||{x:0,y:0,h:32,alive:false}}

/* ---------- física ---------- */
function collide(o,dt){
  o.x+=o.vx*dt;o.hitWall=false;
  for(const s of solids){if(s.t==='p')continue;if(overlap(o,s)){if(o.vx>0)o.x=s.x-o.w;else if(o.vx<0)o.x=s.x+s.w;o.hitWall=true}}
  const prevB=o.y+o.h;o.y+=o.vy*dt;o.onGround=false;o.ground=null;
  for(const s of solids){
    if(!overlap(o,s))continue;
    if(s.t==='p'){if(o.vy>=0&&prevB<=s.y+2){o.y=s.y-o.h;o.vy=0;o.onGround=true;o.ground=s}continue}
    if(o.vy>0){o.y=s.y-o.h;o.vy=0;o.onGround=true;o.ground=s}else if(o.vy<0){o.y=s.y+s.h;o.vy=0}
  }
}

/* ---------- efectos ---------- */
function shake(m,t){shakeM=Math.max(shakeM,m);shakeT=Math.max(shakeT,t)}
function part(o){parts.push(Object.assign({vx:0,vy:0,g:0,life:.5,max:.5,size:3,color:'#fff',type:'spark',rot:0,vr:0},o))}
function floatText(x,y,txt,color){floats.push({x,y,txt,color:color||'#fff',t:1});if(netMode==='host')ftQ.push([Math.round(x),Math.round(y),txt,color||'#fff'])}
function sparks(x,y,n,col){for(let i=0;i<n;i++)part({x,y,vx:rand(-160,160),vy:rand(-160,60),life:.2,max:.2,size:2,color:col||'#fff3b0'})}
function fxExplosion(x,y,r){
  shake(r>45?9:6,.35);xflash=Math.max(xflash,r>45?.1:.05);
  part({x,y,life:.35,max:.35,size:r*1.4,color:'#fff3b0',type:'ring'});
  for(let i=0;i<20;i++){const a=rand(0,Math.PI*2),s=rand(40,240);part({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rand(.35,.7),size:rand(6,14),color:['#fff3b0','#ffd23f','#ff8a2a','#e0482a'][i%4],type:'fire'})}
  for(let i=0;i<12;i++)part({x:x+rand(-r/2,r/2),y:y+rand(-r/3,r/4),vx:rand(-30,30),vy:rand(-70,-20),life:rand(.9,1.6),size:rand(8,18),color:'#5a4a40',type:'smoke'});
  for(let i=0;i<8;i++)part({x,y,vx:rand(-220,220),vy:rand(-400,-150),g:1200,life:1,size:rand(2,4),color:'#7a5a3a',type:'debris',vr:rand(-12,12)});
}

function explosion(x,y,r,dmg,fromPlayer){

function randomDrop(){const k=Math.random();return k<.24?'H':k<.42?'S':k<.56?'F':k<.66?'L':k<.82?'B':'V'}
function damageEnemy(e,d,src){
  if(e.dead)return;
  e.hp-=d;e.hit=.08;
  if(e.hp<=0){
    e.dead=.001;e.vy=e.type==='heli'?0:-260;e.vx=e.type==='heli'?e.vx*.5:-e.face*70;kills++;
    const pts=EPTS[e.type]||100;score+=pts;floatText(e.x+e.w/2,e.y,'+'+pts,e.type==='heli'?C.gold:'#fff');
    if(e.type==='bunk')explosion(e.x+e.w/2,e.y+e.h/2,40,0,true);
    else if(e.type==='bomb')explosion(e.x+8,e.y+16,46,4,true);
    else if(e.type==='heli'){explosion(e.x+36,e.y+15,40,0,true);dropPickup(e.x+30,e.y+20,Math.random()<.5?'L':'R')}
    else if(Math.random()<.16)dropPickup(e.x,e.y,randomDrop());
  }
}
function damageCrate(c,d){if(c.gone)return;c.hp-=d;c.hit=.08;if(c.hp<=0){c.gone=true;crateDebris(c);
  if(c.t==='barrel'){score+=80;explosion(c.x+11,c.y+14,56,6,true)}else{score+=50;dropPickup(c.x+8,c.y,c.d);SFX.eshot()}}}
function damageBoss(d){if(!boss||boss.dead)return;boss.hp-=d;boss.hit=.06;if(boss.hp<=0){boss.hp=0;boss.dead=.001;score+=5000;kills++;floatText(boss.x+65,boss.y,'+5000',C.gold)}}
function dropPickup(x,y,k){pickups.push({id:uid++,x,y,w:18,h:18,vy:-220,k,t:0})}
function hurt(p,n){if(p.inv>0||!p.alive)return;p.hp-=n;p.inv=1.4;SFX.hurt();if(p===me()){shake(5,.25);flash=.25}
  if(p.hp<=0){p.hp=0;p.alive=false;p.dead=0;p.vy=-320;p.vx=-p.face*60;if(p.crouch){p.crouch=false;p.y-=12;p.h=32}}}
function setCrouch(p,on){if(on===p.crouch)return;p.crouch=on;if(on){p.y+=12;p.h=20}else{p.y-=12;p.h=32}}
// cuchillo: si hay un enemigo (o caja) pegado delante, se ataca cuerpo a cuerpo
function tryKnife(p){
  const cx=p.x+8,top=p.y,bot=p.y+p.h,dm=(CHARS[p.ch]||CHARS[0]).dmg;
  const inReach=o=>{const ox=o.x+o.w/2,dx=ox-cx;return dx*p.face>-6&&Math.abs(dx)<o.w/2+18&&o.y<bot&&o.y+o.h>top};
  const e=enemies.find(e=>!e.dead&&e.type!=='heli'&&e.type!=='bunk'&&inReach(e));
  const c=!e&&crates.find(c=>!c.gone&&inReach(c));
  if(!e&&!c)return false;
  p.fireCd=.3;p.knife=.16;SFX.knife();
  const hx=cx+p.face*16,hy=p.y+p.h*.45;
  for(let i=0;i<6;i++)part({x:hx,y:hy,vx:p.face*rand(60,180),vy:rand(-120,120),life:.15,max:.15,size:2,color:'#e8f4ff'});
  if(e)damageEnemy(e,3*dm,'k');else damageCrate(c,3);
  return true;
}
function shoot(p){
  if(tryKnife(p))return;
  const up=p.up&&!p.crouch,f=p.face,dm=(CHARS[p.ch]||CHARS[0]).dmg;
  const ox=up?p.x+8:p.x+8+f*15,oy=up?p.y-6:p.crouch?p.y+9:p.y+14;
  const dir=(sp,spread)=>up?{vx:spread,vy:-sp}:{vx:f*sp,vy:spread};
  const add=(o)=>bullets.push(Object.assign({x:ox,y:oy,life:.8,dmg:dm},o));
  let flashSize=7;
  switch(p.weapon){
    case 'H':p.fireCd=.075;p.ammo--;SFX.mg();add(Object.assign({k:'H'},dir(620,rand(-28,28))));break;
    case 'R':p.fireCd=.42;p.ammo--;SFX.rocket();add(up?{vx:0,vy:-260,ax:0,ay:-900,dmg:4*dm,k:'R',life:1.4}:{vx:f*260,vy:0,ax:f*900,ay:0,dmg:4*dm,k:'R',life:1.4});break;
    case 'S':p.fireCd=.58;p.ammo--;SFX.shotgun();flashSize=13;shake(3,.12);
      for(let i=0;i<6;i++){const a=(i-2.5)*.075+rand(-.02,.02),sp=rand(480,560);add(Object.assign({k:'S',life:.3},up?{vx:Math.sin(a)*sp,vy:-Math.cos(a)*sp}:{vx:f*Math.cos(a)*sp,vy:Math.sin(a)*sp}))}
      if(!up&&p.onGround)p.x-=f*3;break;
    case 'F':p.fireCd=.045;p.ammo--;if(Math.random()<.35)SFX.flame();flashSize=0;
      add(Object.assign({k:'F',life:rand(.3,.38),dmg:.55*dm,hits:new Set()},dir(rand(250,320),rand(-30,30))));break;
    case 'L':p.fireCd=.32;p.ammo--;SFX.laser();flashSize=9;add(Object.assign({k:'L',life:.55,dmg:2.2*dm,hits:new Set()},dir(980,0)));break;
    default:p.fireCd=.2;SFX.shot();add(Object.assign({k:'P'},dir(560,0)));
  }
  if(p.weapon!=='P'&&p.ammo<=0){p.weapon='P';p.ammo=0;floatText(p.x+8,p.y-10,'SIN MUNICIÓN','#ffb4a0')}
  p.recoil=.06;
  if(flashSize)part({x:ox,y:oy,life:.06,max:.06,size:flashSize,color:p.weapon==='L'?'#e0b0ff':'#fff3b0',type:'flash'});
  if(p.weapon==='P'||p.weapon==='H'||p.weapon==='S')part({x:p.x+8,y:p.y+p.h*.45,vx:-f*rand(40,90),vy:rand(-200,-120),g:1200,life:.6,size:p.weapon==='S'?3:2,color:p.weapon==='S'?'#d23a3a':'#e8b84a',type:'shell',vr:20});
}

function act(id){
  if(id==='solo'){netMode=null;tryFullscreen();startMission(false);return}
  if(id==='chars'){state='chars';return}
  if(id==='mission'){selMission=(selMission+1)%MISSIONS.length;store.set('pt_mis',String(selMission));SFX.pick();return}
  if(id.startsWith('ch:')){selChar=clamp(+id.slice(3)||0,0,3);store.set('pt_char',String(selChar));SFX.pick();return}
  if(id==='charsok'){state='title';return}
  if(id==='joinmenu'){if(!room)return;tryFullscreen();state='code';codeBuf='';lobbyMsg='';return}
  if(id.startsWith('k:')){if(codeBuf.length<4)codeBuf+=id.slice(2);lobbyMsg='';return}
  if(id==='del'){codeBuf=codeBuf.slice(0,-1);lobbyMsg='';return}
  if(id==='joincode'){joinByCode();return}
  if(id==='mus'){audioInit();setMusic(!musicOn);return}
  if(id==='snd'){muted=!muted;store.set('pt_sfx',muted?'0':'1');return}
  if(id==='cont'){if(state==='pause')state='play';menuOpen=false;return}
  if(id==='pause'){if(netMode)menuOpen=true;else state='pause';return}
  if(id==='rst'){startMission(false);return}
  if(id==='exit'||id==='title'){netLeave();return}
  if(id==='back'){lobbyRole=null;joinHost=null;pres({st:'menu',host:null,code:null});state='title';return}
  if(id==='cancel'){const wasJoin=lobbyRole==='join';lobbyRole=null;joinHost=null;pres({st:'menu',host:null,code:null});state=wasJoin?'code':'title';return}
  if(id==='host'){if(!room)return;tryFullscreen();lobbyMsg='';state='lobby';lobbyRole='pending';
    const taken=new Set(roomPeers().map(p=>p.presence&&p.presence.code));
    do{myCode=Array.from({length:4},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join('')}while(taken.has(myCode));
    room.emit('start',{g:null}).then(()=>{if(lobbyRole!=='pending')return;lobbyRole='host';pres({st:'hosting',host:null,code:myCode})})
      .catch(err=>{lobbyRole='error';lobbyMsg=err&&err.code==='not_permitted'?'Para crear partidas necesitas permiso de edición. Puedes unirte a la partida de otro jugador con su código.':'No se pudo crear la partida. Revisa tu conexión e intenta de nuevo.'});return}
  if(id.startsWith('go:')){partnerPeer=id.slice(3);{const g=roomPeers().find(p=>p.peer===partnerPeer);partnerChar=clamp(num(g&&g.presence&&g.presence.ch),0,3)|0}netMode='host';lobbyRole=null;startAt=performance.now();lastStartEmit=0;gBits=0;
    pres({st:'playing',host:null,code:null});startMission(false);return}
  if(id==='endtap'){if(netMode==='guest')return;if(state==='over')startMission(true);else if(state==='win'){if(netMode==='host'&&partnerPeer)startMission(false);else{netLeave()}}return}
}

    PL=[];enemies=[];bullets=[];ebullets=[];grenades=[];parts=[];pickups=[];crates=[];floats=[];boss=null;bossActive=false;
    gJ=0;gB=0;sentBits=-1;state='play';menuOpen=false;pres({st:'playing',host:hostPeer,in:0,j:0,b:0})}
  else{lobbyRole=null;joinHost=null;lobbyMsg='Esa partida comenzó con otro jugador.';if(state==='lobby')state='code';pres({st:'menu',host:null})}
}
(async()=>{
  try{if(window.claude&&typeof window.claude.use==='function')room=await window.claude.use('room')}catch(e){room=null}
  if(!room&&window.PT_FIREBASE&&typeof window.createFirebaseRoom==='function'){try{room=await window.createFirebaseRoom(window.PT_FIREBASE)}catch(e){console.warn('Firebase no disponible',e);room=null}}

function drawChars(t){

function drawRain(t,cx){ctx.strokeStyle='rgba(170,205,255,.32)';ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<70;i++){const sp=.8+hash(i+5)*.6,x=((hash(i)*W*3-t*110*sp-cx*.35)%W+W)%W,y=((hash(i+20)*H+t*560*sp)%(H+20))-10;ctx.moveTo(x,y);ctx.lineTo(x-4,y+13)}ctx.stroke()}
function updLightning(dt){if(theme!==1){lightT=0;return}if(lightT>0)lightT-=dt;lightNext-=dt;
  if(lightNext<=0){lightNext=rand(3.5,8);lightT=.28;let x=rand(W*.15,W*.85),y=0;lightBolt=[[x,y]];while(y<H*.55){x+=rand(-26,26);y+=rand(14,30);lightBolt.push([x,y])}
    setTimeout(()=>{if(theme===1&&(state==='play'||state==='title'))RAW.thunder()},rand(250,900))}}
function drawPause(){overlay(.6);txt(netMode?'MENÚ':'PAUSA',W/2,88,'30px '+FD,C.gold,'center');if(netMode)txt('La partida sigue corriendo',W/2,104,'500 10px '+FU,'#e8e2d4','center');drawButtons(screenButtons())}
function drawEnd(win,t){
  overlay(.62);
  if(win)txt('¡MISIÓN CUMPLIDA!',W/2,104,'34px '+FD,C.gold,'center');else txt('MISIÓN FALLIDA',W/2,104,'34px '+FD,'#ff6a5a','center');
  const mm=Math.floor(time/60),ss=String(Math.floor(time%60)).padStart(2,'0');
  txt('PUNTAJE'+(PL.length>1?' DEL EQUIPO':'')+'  '+String(score).padStart(7,'0'),W/2,146,'700 16px '+FU,'#fff','center');
  txt('ENEMIGOS  '+kills+'     TIEMPO  '+mm+':'+ss,W/2,172,'700 13px '+FU,'#e8e2d4','center');

function drawNetLost(t){drawRunner(t);overlay(.7);txt('CONEXIÓN TERMINADA',W/2,140,'28px '+FD,'#ff6a5a','center');txt('El anfitrión salió de la partida.',W/2,170,'500 13px '+FU,'#fff','center');

function drawPortrait(){ctx.fillStyle=C.ink;ctx.fillRect(0,0,W,H);

/* ---------- bucle ---------- */
function resize(){
  const cw=innerWidth,ch=innerHeight;portrait=ch>cw*1.05&&touchMode;
  dpr=Math.min(window.devicePixelRatio||1,2);
  H=360;W=Math.round(clamp(cw/ch*H,480,820));
  scale=Math.min(cw/W,ch/H);offX=(cw-W*scale)/2;offY=(ch-H*scale)/2;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  layoutButtons();
}
addEventListener('resize',resize);resize();
let last=performance.now(),tt=0;
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;tt+=dt;
  readInput();
  if(portrait&&state==='play'&&!netMode)state='pause';
  if(state==='play'||state==='pause'||state==='over'||state==='win')updLightning(state==='pause'?0:dt);
  if(netMode==='guest'){guestNet();if(state!=='title'&&state!=='netlost')guestUpdate(dt)}
  else if(state==='play'){if(netMode==='host')hostNet(now);update(dt)}
  else if(netMode==='host'){hostNet(now);updFx(dt)}
  // música según la escena
  let want=null;
  if(state==='title'||state==='lobby'||state==='code'||state==='chars'||state==='netlost')want='title';
  else if(state==='play'||state==='pause')want=(bossActive&&boss&&!boss.dead)?'boss':'level';
  musicSet(want);musicTick();
  if(state!==prevState){if(state==='win')jingle(true);if(state==='over')jingle(false);prevState=state}
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.ink;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,offX*dpr,offY*dpr);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  if(portrait)drawPortrait();
  else if(state==='title')drawTitle(tt);
  else if(state==='lobby')drawLobby(tt);
  else if(state==='code')drawCode(tt);
  else if(state==='chars')drawChars(tt);
  else if(state==='netlost')drawNetLost(tt);
  else{
    const sx=shakeT>0?rand(-shakeM,shakeM):0,sy=shakeT>0?rand(-shakeM,shakeM):0;
    drawBG(camX);
    ctx.save();ctx.translate(Math.round(-camX+sx),Math.round(sy));
    drawWorld();drawDecor();for(const c of crates)drawCrate(c);for(const k of pickups)drawPickup(k);
    for(const e of enemies)drawEnemy(e);drawBoss();for(const p of PL)if(p!==me())drawPlayer(p);if(me())drawPlayer(me());drawShots();drawParts();
    ctx.restore();
    if(theme===1)drawRain(tt,camX);else{ctx.fillStyle='rgba(255,243,214,.35)';for(let i=0;i<26;i++){const sp=12+hash(i)*30,x=((hash(i+50)*W*2-camX*.9-tt*sp)%W+W)%W,y=40+hash(i+90)*(H-60)+Math.sin(tt*1.3+i)*6;ctx.fillRect(x,y,1+hash(i+7)*1.5,1+hash(i+7)*1.5)}}
    {const vg=ctx.createRadialGradient(W/2,H/2,H*.38,W/2,H/2,H*1.05);const vc=theme===1?'5,12,30':'40,20,10';vg.addColorStop(0,`rgba(${vc},0)`);vg.addColorStop(1,`rgba(${vc},${theme===1?.5:.38})`);ctx.fillStyle=vg;ctx.fillRect(0,0,W,H)}
    if(theme===1&&lightT>0){ctx.fillStyle=`rgba(200,230,255,${lightT*.9})`;ctx.fillRect(0,0,W,H)}
    if(xflash>0){ctx.fillStyle=`rgba(255,248,220,${xflash*2})`;ctx.fillRect(0,0,W,H)}
    if(flash>0){ctx.fillStyle=`rgba(255,60,60,${flash*.8})`;ctx.fillRect(0,0,W,H)}
    if(netMode==='guest'&&!PL.length){overlay(.5);txt('CONECTANDO CON EL ANFITRIÓN…',W/2,H/2,'700 14px '+FU,'#fff','center')}
    drawHUD();
    if(state==='play')drawTouch();
    if(state==='pause'||(state==='play'&&menuOpen))drawPause();
    if(state==='over')drawEnd(false,tt);
    if(state==='win')drawEnd(true,tt);
  }
  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if(/[?&]debug/.test(location.search))window.__pt={get PL(){return PL},get enemies(){return enemies},get state(){return state},spawn,startMission,setChar:i=>{selChar=i}};
})();
