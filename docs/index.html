const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const num=v=>{v=+v;return Number.isFinite(v)?v:0};

function getNoise(){if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}return noiseBuf}
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function distCurve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=Math.tanh(k*x)/Math.tanh(k)}return c}
// bus con distorsión (guitarra): entrada -> saturación -> filtros -> salida
function makeDist(dest,k,lp,vol){const i=AC.createGain(),ws=AC.createWaveShaper(),f=AC.createBiquadFilter(),h=AC.createBiquadFilter(),o=AC.createGain();
  ws.curve=distCurve(k);ws.oversample='2x';f.type='lowpass';f.frequency.value=lp;h.type='highpass';h.frequency.value=70;o.gain.value=vol;
  i.connect(ws);ws.connect(f);f.connect(h);h.connect(o);o.connect(dest);return i}
let sfxDist=null;
function sDist(){if(!sfxDist)sfxDist=makeDist(AC.destination,30,4200,.18);return sfxDist}
function tone(f,d,type='square',v=.06,slide=0,dist=false){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dist?sDist():AC.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v=.2,f=800,dist=false,type='lowpass'){if(!AC||muted)return;const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=getNoise();fl.type=type;fl.frequency.setValueAtTime(f,t);if(type==='lowpass')fl.frequency.exponentialRampToValueAtTime(60,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(dist?sDist():AC.destination);s.start(t,Math.random()*.5);s.stop(t+d+.02)}
// acorde de quinta distorsionado (para golpes de guitarra en efectos)
function sChord(m,d,v=.5,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay;for(const [iv,dt] of [[0,0],[7,5],[12,-4]]){const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=440*Math.pow(2,(m+iv-69)/12);o.detune.value=dt;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(sDist());o.start(t);o.stop(t+d+.02)}}

// generador de enemigos por misión (semilla fija: cada misión siempre igual)
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const FLYERS=['drone','idrone','jet','heli'],STATIC=['bunk','tesla','mort'];
function genSpawns(m){
  const L=LEVELS[m]||LEVELS[0],R=rng(m*9973+7),out=[],tot=L.roster.reduce((a,r)=>a+r[1],0);
  const pick=()=>{let k=R()*tot;for(const [t,w] of L.roster){if((k-=w)<0)return t}return L.roster[0][0]};
  let lastStatic=-9999;
  for(let x=480;x<5650;x+=110+R()*110){
    let t=pick();if(STATIC.includes(t)){if(x-lastStatic<700)t=L.roster[0][0];else lastStatic=x}
    if(!FLYERS.includes(t)&&topAt(x+12)>900)continue; // no aparecer sobre un foso
    const s={t,x:Math.round(x)};
    if(!FLYERS.includes(t)&&!STATIC.includes(t)&&t!=='sled'&&t!=='golem'&&R()<.3){const p=L.plats.find(([px,py,pw])=>x>=px+6&&x<=px+pw-24);if(p)s.y=p[1]-ESZ[t][1]}
    out.push(s);
    if(R()<.12){const bx=Math.round(x+50);if(topAt(bx)<900)out.push({t:'barrel',x:bx})}
  }
  for(const [t,x] of L.fixed)out.push({t,x});
  for(const [x,d] of L.crates)out.push({t:'crate',x,d});
  return out.sort((a,b)=>a.x-b.x);
}

function startMission(fromCp){
  if(!fromCp){score=0;kills=0;time=0;cpIndex=0}
  buildLevel();theme=mission;strikes=[];resetSecrets();
  const cp=CPS[cpIndex];
  PL=[newPlayer(cp,0,selChar)];
  if(netMode==='host'&&partnerPeer)PL.push(newPlayer(cp+26,1,partnerChar));
  enemies=[];bullets=[];ebullets=[];grenades=[];parts=[];pickups=[];crates=[];floats=[];fxQ.length=0;ftQ.length=0;
  queue=genSpawns(mission).filter(s=>s.x>cp+300).map(s=>({...s})).sort((a,b)=>a.x-b.x);
  boss=null;bossActive=false;winT=0;camX=Math.max(0,cp-120);
  banner={txt:cpIndex===0?'MISIÓN '+(theme+1)+' · '+MISSIONS[theme]:'PUNTO DE CONTROL',t:2.2};
  state='play';menuOpen=false;
}
function spawn(s){
  if(s.t==='crate'){crates.push({id:uid++,t:'crate',x:s.x,y:topAt(s.x+15)-28,w:30,h:28,hp:3,d:s.d,hit:0});return}
  if(s.t==='barrel'){crates.push({id:uid++,t:'barrel',x:s.x,y:topAt(s.x+11)-30,w:22,h:30,hp:2,hit:0});return}
  const [w,h,hp]=ESZ[s.t];
  const y=s.t==='heli'?70:FLYERS.includes(s.t)?rand(95,150):s.y!=null?s.y:topAt(s.x+w/2)-h;
  const e={id:uid++,type:s.t,x:s.t==='heli'?camX+W+40:s.x,y,w,h,vx:0,vy:0,hp,maxHp:hp,face:-1,cd:rand(.6,1.4),pdir:-1,pt:rand(1,2.5),hit:0,dead:0,run:0,onGround:false,burst:0,aim:0,peek:0,t:0};
  if(s.t==='heli'){e.cd=2;banner={txt:'¡HELICÓPTERO ENEMIGO!',t:1.6};SFX.alert()}
  enemies.push(e);
}
function nearest(x){let b=null,bd=1e9;for(const p of PL){if(!p.alive)continue;const d=Math.abs(p.x+8-x);if(d<bd){bd=d;b=p}}return b||PL[0]||{x:0,y:0,h:32,alive:false}}

/* ---------- física ---------- */
function collide(o,dt){
  o.x+=o.vx*dt;o.hitWall=false;
  for(const s of solids){if(s.t==='p')continue;if(overlap(o,s)){if(o.vx>0)o.x=s.x-o.w;else if(o.vx<0)o.x=s.x+s.w;o.hitWall=true}}
  const prevB=o.y+o.h;o.y+=o.vy*dt;o.onGround=false;o.ground=null;
  for(const s of solids){
    if(!overlap(o,s))continue;
    if(s.t==='p'){if(o.vy>=0&&prevB<=s.y+2){o.y=s.y-o.h;o.vy=0;o.onGround=true;o.ground=s}continue}
    if(o.vy>0){o.y=s.y-o.h;o.vy=0;o.onGround=true;o.ground=s}else if(o.vy<0){o.y=s.y+s.h;o.vy=0}
  }
}

function shake(m,t){shakeM=Math.max(shakeM,m);shakeT=Math.max(shakeT,t)}
function part(o){parts.push(Object.assign({vx:0,vy:0,g:0,life:.5,max:.5,size:3,color:'#fff',type:'spark',rot:0,vr:0},o))}
function floatText(x,y,txt,color){floats.push({x,y,txt,color:color||'#fff',t:1});if(netMode==='host')ftQ.push([Math.round(x),Math.round(y),txt,color||'#fff'])}
function sparks(x,y,n,col){for(let i=0;i<n;i++)part({x,y,vx:rand(-160,160),vy:rand(-160,60),life:.2,max:.2,size:2,color:col||'#fff3b0'})}
function fxExplosion(x,y,r){
  shake(r>45?9:6,.35);xflash=Math.max(xflash,r>45?.1:.05);
  part({x,y,life:.35,max:.35,size:r*1.4,color:'#fff3b0',type:'ring'});
  for(let i=0;i<20;i++){const a=rand(0,Math.PI*2),s=rand(40,240);part({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rand(.35,.7),size:rand(6,14),color:['#fff3b0','#ffd23f','#ff8a2a','#e0482a'][i%4],type:'fire'})}
  for(let i=0;i<12;i++)part({x:x+rand(-r/2,r/2),y:y+rand(-r/3,r/4),vx:rand(-30,30),vy:rand(-70,-20),life:rand(.9,1.6),size:rand(8,18),color:'#5a4a40',type:'smoke'});
  for(let i=0;i<8;i++)part({x,y,vx:rand(-220,220),vy:rand(-400,-150),g:1200,life:1,size:rand(2,4),color:'#7a5a3a',type:'debris',vr:rand(-12,12)});
}
function crateDebris(c){const col=c.t==='barrel'?'#a83a2a':'#a8703a';for(let i=0;i<8;i++)part({x:c.x+c.w/2,y:c.y+14,vx:rand(-160,160),vy:rand(-320,-120),g:1100,life:1,size:rand(3,6),color:col,type:'debris',vr:rand(-10,10)})}
function explosion(x,y,r,dmg,fromPlayer){
  SFX.boom();fxExplosion(x,y,r);if(netMode==='host')fxQ.push([Math.round(x),Math.round(y),r]);
  if(fromPlayer){
    for(const e of enemies){if(e.dead)continue;const cx=e.x+e.w/2,cy=e.y+e.h/2;if(Math.hypot(cx-x,cy-y)<r+e.w/2)damageEnemy(e,dmg,'x')}
    for(const c of crates){if(!c.gone&&Math.hypot(c.x+c.w/2-x,c.y+14-y)<r+15)damageCrate(c,dmg)}
    if(bossHittable()&&Math.hypot(boss.x+boss.w/2-x,boss.y+boss.h/2-y)<r+60)damageBoss(dmg)
  }else{for(const p of PL)if(p.alive&&Math.hypot(p.x+8-x,p.y+p.h/2-y)<r+8)hurt(p,1);for(const a of allies)if(!a.chute&&a.hp>0&&Math.hypot(a.x+7-x,a.y+10-y)<r+6)hurtAlly(a,2)}
}

/* ---------- combate ---------- */
function randomDrop(){const k=Math.random();return k<.24?'H':k<.42?'S':k<.56?'F':k<.66?'L':k<.82?'B':'V'}
function damageEnemy(e,d,src){
  if(e.dead)return;
  e.hp-=d;e.hit=.08;
  if(e.hp<=0){
    e.dead=.001;e.vy=e.type==='heli'?0:-260;e.vx=e.type==='heli'?e.vx*.5:-e.face*70;kills++;
    const pts=EPTS[e.type]||100;score+=pts;floatText(e.x+e.w/2,e.y,'+'+pts,e.type==='heli'?C.gold:'#fff');
    if(e.type==='bunk')explosion(e.x+e.w/2,e.y+e.h/2,40,0,true);
    else if(e.type==='bomb')explosion(e.x+8,e.y+16,46,4,true);
    else if(['drone','idrone','mine','sled','golem','tesla','jet'].includes(e.type)){explosion(e.x+e.w/2,e.y+e.h/2,e.type==='golem'?50:32,e.type==='mine'?3:0,true);if(e.type==='golem'||Math.random()<.3)dropPickup(e.x,e.y,randomDrop())}
    else if(e.type==='heli'){explosion(e.x+36,e.y+15,40,0,true);dropPickup(e.x+30,e.y+20,Math.random()<.5?'L':'R')}
    else if(Math.random()<.16)dropPickup(e.x,e.y,randomDrop());
  }
}
function damageCrate(c,d){if(c.gone)return;c.hp-=d;c.hit=.08;if(c.hp<=0){c.gone=true;crateDebris(c);
  if(c.t==='barrel'){score+=80;explosion(c.x+11,c.y+14,56,6,true)}else{score+=50;dropPickup(c.x+8,c.y,c.d);SFX.eshot()}}}
function damageBoss(d){if(!boss||boss.dead)return;boss.hp-=d;boss.hit=.06;if(boss.hp<=0){boss.hp=0;boss.dead=.001;score+=5000;kills++;floatText(boss.x+65,boss.y,'+5000',C.gold)}}
function dropPickup(x,y,k){pickups.push({id:uid++,x,y,w:18,h:18,vy:-220,k,t:0})}
function hurt(p,n){if(p.inv>0||!p.alive)return;p.hp-=n;p.inv=1.4;SFX.hurt();if(p===me()){shake(5,.25);flash=.25}
  if(p.hp<=0){p.hp=0;p.alive=false;p.dead=0;p.vy=-320;p.vx=-p.face*60;if(p.crouch){p.crouch=false;p.y-=12;p.h=32}}}
function setCrouch(p,on){if(on===p.crouch)return;p.crouch=on;if(on){p.y+=12;p.h=20}else{p.y-=12;p.h=32}}
// cuchillo: si hay un enemigo (o caja) pegado delante, se ataca cuerpo a cuerpo
function tryKnife(p){
  const cx=p.x+8,top=p.y,bot=p.y+p.h,dm=(CHARS[p.ch]||CHARS[0]).dmg;
  const inReach=o=>{const ox=o.x+o.w/2,dx=ox-cx;return dx*p.face>-6&&Math.abs(dx)<o.w/2+18&&o.y<bot&&o.y+o.h>top};
  const e=enemies.find(e=>!e.dead&&e.type!=='heli'&&e.type!=='bunk'&&!hid(e)&&inReach(e));
  const c=!e&&crates.find(c=>!c.gone&&inReach(c));
  if(!e&&!c)return false;
  p.fireCd=.3;p.knife=.16;SFX.knife();
  const hx=cx+p.face*16,hy=p.y+p.h*.45;
  for(let i=0;i<6;i++)part({x:hx,y:hy,vx:p.face*rand(60,180),vy:rand(-120,120),life:.15,max:.15,size:2,color:'#e8f4ff'});
  if(e)damageEnemy(e,3*dm,'k');else damageCrate(c,3);
  return true;
}
function shoot(p){
  if(tryKnife(p))return;
  const up=p.up&&!p.crouch,f=p.face,dm=(CHARS[p.ch]||CHARS[0]).dmg;
  const ox=up?p.x+8:p.x+8+f*15,oy=up?p.y-6:p.crouch?p.y+9:p.y+14;
  const dir=(sp,spread)=>up?{vx:spread,vy:-sp}:{vx:f*sp,vy:spread};
  const add=(o)=>bullets.push(Object.assign({x:ox,y:oy,life:.8,dmg:dm},o));
  let flashSize=7;
  switch(p.weapon){
    case 'H':p.fireCd=.075;p.ammo--;SFX.mg();add(Object.assign({k:'H'},dir(620,rand(-28,28))));break;
    case 'R':p.fireCd=.42;p.ammo--;SFX.rocket();add(up?{vx:0,vy:-260,ax:0,ay:-900,dmg:4*dm,k:'R',life:1.4}:{vx:f*260,vy:0,ax:f*900,ay:0,dmg:4*dm,k:'R',life:1.4});break;
    case 'S':p.fireCd=.58;p.ammo--;SFX.shotgun();flashSize=13;shake(3,.12);
      for(let i=0;i<6;i++){const a=(i-2.5)*.075+rand(-.02,.02),sp=rand(480,560);add(Object.assign({k:'S',life:.3},up?{vx:Math.sin(a)*sp,vy:-Math.cos(a)*sp}:{vx:f*Math.cos(a)*sp,vy:Math.sin(a)*sp}))}
      if(!up&&p.onGround)p.x-=f*3;break;
    case 'F':p.fireCd=.045;p.ammo--;if(Math.random()<.35)SFX.flame();flashSize=0;
      add(Object.assign({k:'F',life:rand(.3,.38),dmg:.55*dm,hits:new Set()},dir(rand(250,320),rand(-30,30))));break;
    case 'L':p.fireCd=.32;p.ammo--;SFX.laser();flashSize=9;add(Object.assign({k:'L',life:.55,dmg:2.2*dm,hits:new Set()},dir(980,0)));break;
    default:p.fireCd=.2;SFX.shot();add(Object.assign({k:'P'},dir(560,0)));
  }
  if(p.weapon!=='P'&&p.ammo<=0){p.weapon='P';p.ammo=0;floatText(p.x+8,p.y-10,'SIN MUNICIÓN','#ffb4a0')}
  p.recoil=.06;
  if(flashSize)part({x:ox,y:oy,life:.06,max:.06,size:flashSize,color:p.weapon==='L'?'#e0b0ff':'#fff3b0',type:'flash'});
  if(p.weapon==='P'||p.weapon==='H'||p.weapon==='S')part({x:p.x+8,y:p.y+p.h*.45,vx:-f*rand(40,90),vy:rand(-200,-120),g:1200,life:.6,size:p.weapon==='S'?3:2,color:p.weapon==='S'?'#d23a3a':'#e8b84a',type:'shell',vr:20});
}
function throwBomb(p){p.bombs--;SFX.toss();grenades.push({x:p.x+8+p.face*6,y:p.y+8,vx:p.face*230+p.vx*.4,vy:p.crouch?-200:-340,t:1.2,rot:0,own:'p'})}

const SECRETS={0:[{x0:1150,x1:1270,reward:'hearts'},{x0:3470,x1:3630,reward:'gallo'},{x0:5000,x1:5120,reward:'hearts'}],
               1:[{x0:2240,x1:2400,reward:'hearts'},{x0:4250,x1:4420,reward:'gallo'},{x0:5560,x1:5680,reward:'hearts'}]};
let allies=[],secrets=[];
function resetSecrets(){allies=[];secrets=(LEVELS[mission]||LEVELS[0]).secrets.map(([x0,x1,reward])=>({x0,x1,reward,hits:0,done:false}))}
function skyShot(b){ // bala del jugador que sale por arriba de la pantalla
  for(const s of secrets){if(s.done||b.x<s.x0||b.x>s.x1)continue;s.hits++;sparks(b.x,8,6,'#ffe9a0');
    if(s.hits>=5){s.done=true;triggerSecret(s)}break}
}
function triggerSecret(s){
  const cx=(s.x0+s.x1)/2;SFX.secret();banner={txt:'¡EASTER EGG!',t:1.8};score+=1000;floatText(cx,60,'+1000 SECRETO',C.gold);
  if(s.reward==='hearts'){for(let i=0;i<4;i++){pickups.push({id:uid++,x:cx-40+i*26,y:-20-i*30,w:18,h:18,vy:0,k:i===3?'B':'V',t:0})}}
  else spawnGallo(cx);
}
function spawnGallo(x){
  const owner=PL.reduce((a,p,i)=>p.alive&&Math.abs(p.x-x)<Math.abs((PL[a]||p).x-x)?i:a,0);
  allies.push({id:uid++,x,y:-60,w:16,h:26,vx:0,vy:0,face:1,onGround:false,hp:14,maxHp:14,cd:1,burst:0,hit:0,t:0,run:0,chute:true,flash:0,owner});
}
function galloTarget(a){
  let best=null,bd=1e9;const ax=a.x+7,ay=a.y+10;
  for(const e of enemies){if(e.dead||hid(e)||e.x<camX-10||e.x>camX+W+10)continue;const dx=e.x+e.w/2-ax,dy=e.y+e.h/2-ay;if(Math.abs(dx)>330||Math.abs(dy)>150)continue;const d=Math.hypot(dx,dy);if(d<bd){bd=d;best={x:e.x+e.w/2,y:e.y+e.h/2}}}
  if(bossHittable()){const dx=boss.x+boss.w/2-ax;if(Math.abs(dx)<360&&Math.abs(dx)<bd)best={x:boss.x+boss.w/2,y:boss.y+boss.h*.5}}
  return best;
}
function updAlly(a,dt){
  a.t+=dt;a.cd-=dt;a.hit-=dt;a.flash-=dt;
  const own=PL[a.owner]&&PL[a.owner].alive?PL[a.owner]:nearest(a.x);
  if(a.chute){a.vy=Math.min(a.vy+G*.12*dt,65);a.x+=Math.sin(a.t*2)*20*dt;a.y+=a.vy*dt;
    const fy=floorBelow(a.x+7,a.y+a.h);if(a.y+a.h>=fy-1&&a.y>0){a.y=fy-a.h;a.chute=false;a.onGround=true;SFX.crow();floatText(a.x+7,a.y-14,'¡KIKIRIKÍ!',C.gold);
      for(let i=0;i<8;i++)part({x:a.x+7,y:a.y+a.h,vx:rand(-70,70),vy:rand(-50,-10),life:.4,size:4,color:dustCol(),type:'smoke'})}
    return}
  const tgt=galloTarget(a);
  const want=own.x+8-own.face*30;const dx=want-(a.x+7);
  a.vx=Math.abs(dx)>14?Math.sign(dx)*175:0;
  a.face=tgt?(tgt.x<a.x+7?-1:1):(a.vx?Math.sign(a.vx):own.face);
  if(a.onGround&&a.vx){const ahead=a.x+7+Math.sign(a.vx)*12;if(!solidHit(ahead,a.y+a.h+6,true)||a.hitWall){a.vy=-560;a.onGround=false}}
  if(a.onGround&&own.onGround&&own.y+own.h<a.y+a.h-30){a.vy=-600;a.onGround=false}
  a.vy=Math.min(a.vy+G*dt,900);collide(a,dt);if(a.vx&&a.onGround)a.run+=dt;
  if(Math.abs(own.x-a.x)>380||a.y>H+40){a.x=own.x-own.face*24;a.y=own.y-20;a.vy=0;for(let i=0;i<8;i++)part({x:a.x+7,y:a.y+10,vx:rand(-90,90),vy:rand(-90,20),g:300,life:.7,size:3,color:'#1f1a1f',type:'debris',vr:rand(-8,8)})}
  a.x=clamp(a.x,camX+2,camX+W-a.w-2);
  if(tgt){
    if(a.burst<=0&&a.cd<=0){a.burst=6}
    if(a.burst>0&&a.cd<=0){a.burst--;a.cd=a.burst>0?.085:.9;a.flash=.05;SFX.mg();
      const ox=a.x+7+a.face*14,oy=a.y+9,ang=Math.atan2(tgt.y-oy,tgt.x-ox);
      bullets.push({x:ox,y:oy,vx:Math.cos(ang)*620,vy:Math.sin(ang)*620+rand(-25,25),dmg:.7,k:'H',life:.8,ally:true});
      part({x:ox,y:oy,life:.05,max:.05,size:6,color:'#fff3b0',type:'flash'})}
  }else if(a.burst>0){a.burst=0;a.cd=.4}
}
function hurtAlly(a,n){if(a.hit>0)return;a.hp-=n;a.hit=.35;sparks(a.x+7,a.y+8,4,'#ff8a3a');
  if(a.hp<=0){SFX.crow();floatText(a.x+7,a.y-10,'¡CAÍDO EN COMBATE!','#ffb4a0');
    for(let i=0;i<16;i++)part({x:a.x+7,y:a.y+10,vx:rand(-140,140),vy:rand(-220,-40),g:260,life:1.2,size:rand(2,4),color:['#1f1a1f','#c0392b','#e8761e'][i%3],type:'debris',vr:rand(-10,10)})}}
function drawGallo(a){
  const cx=a.x+8,fy=a.y+a.h,t=a.t;ctx.save();
  if(!a.chute){ctx.fillStyle='rgba(40,20,5,.25)';ctx.beginPath();ctx.ellipse(cx,floorBelow(cx,fy)+1,8,2.5,0,0,7);ctx.fill()}
  if(a.chute){ctx.strokeStyle='rgba(30,30,30,.7)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-15,fy-44);ctx.lineTo(cx-4,fy-18);ctx.moveTo(cx+15,fy-44);ctx.lineTo(cx+4,fy-18);ctx.moveTo(cx,fy-50);ctx.lineTo(cx,fy-20);ctx.stroke();
    for(let i=0;i<4;i++){ctx.fillStyle=i%2?'#1b1f22':'#c0392b';ctx.beginPath();ctx.moveTo(cx,fy-44);ctx.arc(cx,fy-44,17,Math.PI+i*Math.PI/4,Math.PI+(i+1)*Math.PI/4);ctx.closePath();ctx.fill()}
    ctx.fillStyle='#f2ead8';ctx.beginPath();ctx.arc(cx,fy-54,2.5,0,7);ctx.fill()}
  if(a.hit>0&&Math.floor(a.hit*20)%2)ctx.globalAlpha=.4;
  ctx.translate(cx,fy);ctx.scale(a.face*1.3,1.3);
  const leg=a.vx&&a.onGround?Math.sin(a.run*18)*3:0;
  ctx.strokeStyle='#e8a020';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-2,-6);ctx.lineTo(-3+leg,0);ctx.lineTo(-6+leg,0);ctx.moveTo(2,-6);ctx.lineTo(3-leg,0);ctx.lineTo(6-leg,0);ctx.stroke();
  const fl=Math.sin(t*14);
  [['#c0392b',-13,-20,0],['#e8761e',-15,-14,.6],['#ffd23f',-12,-9,1.2]].forEach(([c,x,y,o])=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(-6,-12);ctx.quadraticCurveTo(x-2,y-6+Math.sin(t*12+o)*2,x+Math.sin(t*10+o),y);ctx.quadraticCurveTo(x+4,y+4,-5,-8);ctx.fill()});
  ctx.fillStyle='#1f1a1f';ctx.beginPath();ctx.ellipse(0,-11,8,7,0,0,7);ctx.fill();
  ctx.strokeStyle='#7a1e1e';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-11,6,Math.PI*1.1,Math.PI*1.7);ctx.stroke();
  ctx.fillStyle='#ffd23f';for(let i=0;i<3;i++)ctx.fillRect(-4+i*3,-6,1.5,1.5);
  ctx.fillStyle='#3a3a3a';ctx.fillRect(0,-17.5,8,2.5);ctx.fillStyle='#cfd6dc';for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(1+i*2.6,-17.5);ctx.lineTo(2.2+i*2.6,-20);ctx.lineTo(3.4+i*2.6,-17.5);ctx.fill()}
  ctx.fillStyle='#1f1a1f';ctx.beginPath();ctx.arc(4,-21.5,4.5,0,7);ctx.fill();
  ctx.fillStyle='#e0302a';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(1+i*2.2,-25);ctx.lineTo(0.5+i*2.2+(i-1)*.6,-31-(i===1||i===2?2:0)+fl*.6);ctx.lineTo(3+i*2.2,-25);ctx.fill()}
  ctx.fillStyle='#f0b020';ctx.beginPath();ctx.moveTo(8,-22.5);ctx.lineTo(12.5,-21);ctx.lineTo(8,-19.5);ctx.fill();
  ctx.fillStyle='#d0302a';ctx.beginPath();ctx.ellipse(7.5,-17.5,1.6,2.6,0,0,7);ctx.fill();
  ctx.fillStyle='#0a0a0a';ctx.fillRect(3.5,-23.5,5.5,2.2);ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(4.2,-23.2,1.4,.8);
  ctx.fillStyle='#2b2b2b';ctx.fillRect(2,-12.5,13,3);ctx.fillRect(6,-10,3,4);ctx.fillStyle='#4a4a4a';ctx.fillRect(2,-13.5,6,1.5);
  ctx.fillStyle='#2e2630';ctx.beginPath();ctx.ellipse(2,-10,4.5,3.5,.3,0,7);ctx.fill();
  if(a.flash>0){ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(16,-11,4,0,7);ctx.fill()}
  ctx.restore();ctx.globalAlpha=1;
  if(!a.chute){ctx.font='700 7px '+FU;ctx.textAlign='center';ctx.fillStyle=C.gold;ctx.fillText('GALLO',cx,a.y-14);
    if(a.hp<a.maxHp){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(cx-9,a.y-11,18,3);ctx.fillStyle='#ff4d5e';ctx.fillRect(cx-9,a.y-11,18*a.hp/a.maxHp,3)}}
}
function drawSecretHints(){
  for(const s of secrets){if(s.done)continue;const cx=(s.x0+s.x1)/2;if(cx<camX-20||cx>camX+W+20)continue;
    const tw=.35+.35*Math.sin(performance.now()/260+cx)+(s.hits?.3:0),r=1.5+s.hits*.6;ctx.fillStyle=`rgba(255,240,190,${clamp(tw,0,1)})`;
    ctx.fillRect(cx-r*2,30-.6,r*4,1.2);ctx.fillRect(cx-.6,30-r*2,1.2,r*4);ctx.beginPath();ctx.arc(cx,30,r*.7,0,7);ctx.fill()}
}

const keys={};const inp={left:false,right:false,up:false,down:false,jump:false,fire:false,bomb:false};
let jumpEdge=false,bombEdge=false,prevJump=false,prevBomb=false,touchMode=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const KMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',KeyZ:'jump',Space:'jump',KeyX:'fire',KeyJ:'fire',KeyC:'bomb',KeyK:'bomb'};
addEventListener('keydown',e=>{audioInit();
  if(state==='code'){const k=(e.key||'').toUpperCase();
    if(k.length===1&&CODE_CH.includes(k)){act('k:'+k);e.preventDefault();return}
    if(e.key==='Backspace'){act('del');e.preventDefault();return}
    if(e.key==='Enter'){act('joincode');e.preventDefault();return}
    if(e.key==='Escape'){act('back');return}
    return}
  if(state==='chars'){if(e.key==='ArrowLeft'){act('ch:'+((selChar+3)%4));e.preventDefault()}else if(e.key==='ArrowRight'){act('ch:'+((selChar+1)%4));e.preventDefault()}else if(e.key==='Enter'||e.key==='Escape')act('charsok');return}
  if(KMAP[e.code]){keys[KMAP[e.code]]=true;e.preventDefault()}
  if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')act(menuOpen?'cont':'pause');else if(state==='pause')act('cont')}
  if(e.code==='KeyM')setMusic(!musicOn);
  if(e.code==='Enter'){if(state==='title')act('solo');else if(state==='over'||state==='win')act('endtap');else if(state==='netlost')act('title')}
});
addEventListener('keyup',e=>{if(KMAP[e.code])keys[KMAP[e.code]]=false});

function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-offX)/scale,y:(e.clientY-r.top-offY)/scale}}
function btnAt(p){
  // cruceta: el dedo puede combinar direcciones (p. ej. correr y apuntar arriba a la vez)
  const c=BTN.pad,dx=p.x-c.x,dy=p.y-c.y;
  if(Math.abs(dx)<92&&dy>-86&&dy<76&&p.x<210){const d=[];if(dy<-26)d.push('up');else if(dy>28)d.push('down');if(dx<-20)d.push('left');else if(dx>20)d.push('right');return d.length?d.join('+'):'pad'}
  for(const k of ['fire','jump','bomb']){const b=BTN[k];if(Math.hypot(p.x-b.x,p.y-b.y)<b.r+12)return k}
  return null;
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();cv.focus();
  if(e.pointerType==='touch'||e.pointerType==='pen')touchMode=true;
  const p=toLogical(e);
  const bs=screenButtons();
  if(bs){for(const b of bs)if(!b.disabled&&inRect(p.x,p.y,b)){act(b.id);return}if(state!=='play')return;if(menuOpen)return}
  if(state==='over'||state==='win'){act('endtap');return}
  if(state==='netlost'){act('title');return}
  if(state!=='play')return;
  if(Math.hypot(p.x-BTN.pause.x,p.y-BTN.pause.y)<BTN.pause.r+10){act('pause');return}
  pointers.set(e.pointerId,btnAt(p));

function act(id){
  if(id==='solo'){netMode=null;mission=0;tryFullscreen();startMission(false);return}
  if(id==='chars'){state='chars';return}
  if(id.startsWith('ch:')){selChar=clamp(+id.slice(3)||0,0,3);store.set('pt_char',String(selChar));SFX.pick();return}
  if(id==='charsok'){state='title';return}
  if(id==='joinmenu'){if(!room)return;tryFullscreen();state='code';codeBuf='';lobbyMsg='';return}
  if(id.startsWith('k:')){if(codeBuf.length<4)codeBuf+=id.slice(2);lobbyMsg='';joinSearch=null;return}
  if(id==='del'){codeBuf=codeBuf.slice(0,-1);lobbyMsg='';joinSearch=null;return}
  if(id==='joincode'){joinSearch=null;joinByCode();return}
  if(id==='mus'){audioInit();setMusic(!musicOn);return}
  if(id==='snd'){muted=!muted;store.set('pt_sfx',muted?'0':'1');return}
  if(id==='cont'){if(state==='pause')state='play';menuOpen=false;return}
  if(id==='pause'){if(netMode)menuOpen=true;else state='pause';return}
  if(id==='rst'){startMission(false);return}
  if(id==='exit'||id==='title'){netLeave();return}
  if(id==='back'){lobbyRole=null;joinHost=null;pres({st:'menu',host:null,code:null});state='title';return}
  if(id==='cancel'){const wasJoin=lobbyRole==='join';lobbyRole=null;joinHost=null;pres({st:'menu',host:null,code:null});state=wasJoin?'code':'title';return}
  if(id==='host'){if(!room)return;tryFullscreen();lobbyMsg='';state='lobby';lobbyRole='pending';
    const taken=new Set(roomPeers().map(p=>p.presence&&p.presence.code));
    do{myCode=Array.from({length:4},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join('')}while(taken.has(myCode));
    room.emit('start',{g:null}).then(()=>{if(lobbyRole!=='pending')return;lobbyRole='host';pres({st:'hosting',host:null,code:myCode})})
      .catch(err=>{lobbyRole='error';lobbyMsg=err&&err.code==='not_permitted'?'Para crear partidas necesitas permiso de edición. Puedes unirte a la partida de otro jugador con su código.':'No se pudo crear la partida. Revisa tu conexión e intenta de nuevo.'});return}
  if(id.startsWith('go:')){partnerPeer=id.slice(3);{const g=roomPeers().find(p=>p.peer===partnerPeer);partnerChar=clamp(num(g&&g.presence&&g.presence.ch),0,3)|0}netMode='host';lobbyRole=null;startAt=performance.now();lastStartEmit=0;gBits=0;
    pres({st:'playing',host:null,code:null});mission=0;startMission(false);return}
  if(id==='endtap'){if(netMode==='guest')return;if(state==='over')startMission(true);else if(state==='win'){
    if(mission<MISSIONS.length-1){mission++;cpIndex=0;startMission(true)}
    else if(netMode==='host'&&partnerPeer){mission=0;startMission(false)}else netLeave()}return}
}
